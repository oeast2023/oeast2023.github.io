<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carolina Game Day Checklist</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .checklist-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            border-top: 8px solid #73000A; /* Carolina Garnet Accent */
        }

        h2 {
            margin-top: 0;
            color: #111111;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 22px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #73000A;
        }

        button {
            padding: 10px 15px;
            background-color: #73000A; /* Carolina Garnet */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #520007;
        }

        .checklist {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eeeeee;
            font-size: 16px;
            color: #333333;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .checklist-item input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #73000A;
        }

        .checklist-item input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: #888888;
        }

        .checklist-item label {
            cursor: pointer;
            flex: 1;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="checklist-container">
    <h2>Carolina Game Day Checklist</h2>
    
    <div class="input-area">
        <input type="text" id="itemInput" placeholder="Add game day gear..." autocomplete="off">
        <button id="addButton">Add</button>
    </div>

    <ul id="checklist" class="checklist">
        <!-- Pre-populated Game Day sample items -->
        <li class="checklist-item">
            <input type="checkbox" id="item-1">
            <label for="item-1">Pack the tailgate chairs</label>
        </li>
        <li class="checklist-item">
            <input type="checkbox" id="item-2">
            <label for="item-2">Grab clear stadium bag</label>
        </li>
        <li class="checklist-item">
            <input type="checkbox" id="item-3">
            <label for="item-3">Download digital tickets</label>
        </li>
    </ul>
</div>

<script>
    const itemInput = document.getElementById('itemInput');
    const addButton = document.getElementById('addButton');
    const checklist = document.getElementById('checklist');
    let itemCounter = 4; 

    function addItem() {
        const itemText = itemInput.value.trim();
        if (itemText === '') return;

        const li = document.createElement('li');
        li.className = 'checklist-item';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `item-${itemCounter}`;

        const label = document.createElement('label');
        label.setAttribute('for', `item-${itemCounter}`);
        label.textContent = itemText;

        li.appendChild(checkbox);
        li.appendChild(label);
        checklist.appendChild(li);

        itemInput.value = '';
        itemInput.focus();
        itemCounter++;
    }

    addButton.addEventListener('click', addItem);

    itemInput.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            addItem();
        }
    });
</script>

</body>
</html>
