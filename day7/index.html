<!--let = values that can be changed-->
<!--Booleans = true/false-->
<!--text must be wrapped in ""-->
<!--Conditionals- if any one of them run -> others won't get checked
        if
        else if
        else- defaults to this if other conditions aren't met-->
<!--Comparison operators
        === - stricly equal
        !== not equal to-->
<!--Function = will call the macro for you
        use camelcase (lowercase first letter, every other one = capitalized)-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Java Script Example</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="player-card">
            <h2>Player Status</h2>
            
            <p>HP: <span id="health-display">100</span></p> <!--Javascript can access values based on ids-->
            <p id="status-message">Ready for Battle!</p>

            <button onclick="takeDamage()">Take 30 Damage</button>
        </div>

        <script src="script.js"></script>

    </body>
</html>
