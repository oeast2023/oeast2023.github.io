<!DOCTYPE html>

<html lang="en">

 <head>
        <title>Table Example Day 4</title>
</head>

<body>

    <table border="1"> <!--border = adds an outline-->
        <thead> <!--tr = row, th is used for body-->
            <tr>
                <th>Cell 1</th>
                <th>Cell 2</th>
                <th>Cell 3</th>
            </tr>
        </thead>
        <tbody> <!--td is used for body and footer-->
            <tr>
                <td>Data 1</td>
                <td>Data 2</td>
                <td>Data 3</td>
            </tr>
        </tbody>
        <tfoot>
            <tr> <!--colspan = creates one long cell-->
                <td colspan="3">Foot 1</td>
            </tr>
        </tfoot>
    </table>

</body>




</html>
